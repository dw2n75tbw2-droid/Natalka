<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6EF">
<title>Ahoj</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<script>
/* ═══════════════════════════════════════════════════════════════
   VARIANTA B — krémové pozadí, fotky plovou ve čtvercích.

   U každého bloku je "typ":
     "vlevo"  = fotka vlevo, text vpravo
     "vpravo" = fotka vpravo, text vlevo
     "solo"   = fotka uprostřed, bez textu
   Na telefonu se vždycky skládá pod sebe, jen se fotka
   lehce odsazuje na tu stranu, kam patří.
   ═══════════════════════════════════════════════════════════════ */
const NASTAVENI = {

  podpis: "Filip",

  uvodNadpis: "Ahoj Natálko",
  uvodText:   "Než se zeptám na to hlavní, dej mi třicet vteřin. Stačí scrollovat.",

  zaverNadpis: "Tak co, dáš mi na sebe kontakt?",
  zaverText:   "Stačí jedno z toho. Odepíšu dřív, než tuhle stránku stihneš zavřít.",

  accessKey: "c239e6a5-e792-464a-88e6-96b75bb07b07",
  email:     "simekfilip@icloud.com",

  kapitoly: [
    { foto:"1.jpg",  typ:"vlevo",  nadpis:"Začneme potmě",
      text:"Ať je to trochu jako včera. Akorát tentokrát je slyšet vlastní slovo." },

    { foto:"2.jpg",  typ:"vpravo", nadpis:"A takhle za světla",
      text:"Žádný blesk, žádný dav, žádné křičení přes basy. Snad to není zklamání." },

    { foto:"3.jpg",  typ:"vlevo",  nadpis:"Umím žonglovat",
      text:"Tři míčky spolehlivě. Čtyři, když se nikdo nedívá. Pět nikdy." },

    { foto:"4.jpg",  typ:"solo",   nadpis:"", text:"" },

    { foto:"5.jpg",  typ:"vpravo", nadpis:"Nejradši, když to bolí",
      text:"Neptej se proč. Sám to úplně nechápu." },

    { foto:"6.jpg",  typ:"vlevo",  nadpis:"Hudba mi dělá dobře",
      text:"Stál jsem vzadu. Vepředu není vidět a zvuk je stejně lepší vzadu." },

    { foto:"7.jpg",  typ:"vpravo", nadpis:"Tohle mě čeká",
      text:"Zatím spíš studuju, než abych někoho léčil. Ale plášť už mám." },

    { foto:"8.jpg",  typ:"vlevo",  nadpis:"A většina dní vypadá takhle",
      text:"Fotka je z callu, na kterém jsem se tvářil, že dávám pozor." },

    { foto:"9.jpg",  typ:"solo",   nadpis:"", text:"" },

    { foto:"10.jpg", typ:"vpravo", nadpis:"Tohle mi kdysi udělal kamarád",
      text:"Nechal jsem si to. Přišlo mi fér, abys to viděla hned na začátku." }
  ]
};
/* ═══════════════════════ konec úprav ═══════════════════════════ */
</script>

<style>
:root{
  --cream:#FBF6EF;
  --cream-2:#F4EBE0;
  --rose:#E0668F;
  --rose-deep:#C4356B;
  --ink:#3E2233;
  --mute:#8B6A79;
  --paper:#FFFDFB;
  --lift:rgba(84,48,66,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);background:var(--cream);overflow-x:clip;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{display:block;max-width:100%}

#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:40;
  background:linear-gradient(90deg,var(--rose),var(--rose-deep));transition:width .1s linear}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ═══════ obálka ═══════ */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;background:var(--cream);
  transition:opacity .5s ease,transform .5s ease}
#gate.gone{opacity:0;transform:scale(1.12);pointer-events:none}
.env{position:relative;width:250px;height:168px;cursor:pointer;
  perspective:900px;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pocket{position:absolute;inset:0;border-radius:10px;overflow:hidden;
  box-shadow:0 22px 44px -16px var(--lift)}
.env-back{position:absolute;inset:0;background:linear-gradient(160deg,#F0A0BC,var(--rose))}
.env-back::after{content:"";position:absolute;inset:0;
  background:linear-gradient(150deg,transparent 48%,rgba(196,53,107,.2) 50%),
             linear-gradient(210deg,transparent 48%,rgba(196,53,107,.2) 50%)}
.letter{position:absolute;left:18px;right:18px;bottom:-124px;height:124px;
  background:var(--paper);border-radius:6px 6px 0 0;display:flex;align-items:center;
  justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:34px;color:var(--rose-deep);
  transition:bottom .75s cubic-bezier(.2,1.05,.4,1) .3s}
.env.opened .letter{bottom:16px}
.flap{position:absolute;top:0;left:0;border-left:125px solid transparent;
  border-right:125px solid transparent;border-top:96px solid #EE94B4;
  transform-origin:top center;z-index:3;transition:transform .6s ease,opacity .3s .42s}
.env.opened .flap{transform:rotateX(180deg);opacity:0}
.seal{position:absolute;top:74px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#EE7FA5,var(--rose-deep));
  box-shadow:0 4px 12px rgba(196,53,107,.45);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;z-index:4;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .45s}
.env.opened .seal{transform:scale(.2) translateY(-40px) rotate(50deg);opacity:0}
.hint{font-size:13px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:var(--rose-deep);animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}

/* ═══════ úvod ═══════ */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:100px 26px 96px}
.ball-wrap{position:absolute;top:0;left:50%;display:flex;flex-direction:column;align-items:center;
  transform:translateX(-50%) translateY(-140px);opacity:0}
body.open .ball-wrap{animation:drop .9s cubic-bezier(.34,1.4,.5,1) .15s both}
@keyframes drop{to{transform:translateX(-50%) translateY(0);opacity:1}}
.cord{width:2px;height:44px;background:linear-gradient(var(--ink),rgba(62,34,51,.15))}
.ball{width:52px;height:52px;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 32% 28%,#fff 0%,#F8CEDC 34%,var(--rose) 78%,var(--rose-deep) 100%);
  box-shadow:0 10px 28px -8px rgba(196,53,107,.5),inset -6px -8px 14px rgba(196,53,107,.35);
  animation:spin 8s linear infinite}
.ball::before{content:"";position:absolute;inset:0;background-image:
  repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 1px,transparent 1px 8px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 1px,transparent 1px 8px)}
.ball::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 5px,transparent 6px)}
@keyframes spin{to{transform:rotate(360deg)}}

.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--rose-deep)}
.hero .eyebrow{margin-bottom:18px}
.hero h1{font-family:'Fraunces',Georgia,serif;font-weight:900;letter-spacing:-.025em;
  font-size:clamp(38px,13vw,68px);line-height:1;margin-bottom:18px;color:var(--ink)}
.hero p{font-size:16.5px;line-height:1.6;color:var(--mute);max-width:22em}
.js .hero .eyebrow,.js .hero h1,.js .hero p,.js .scroll-cue{opacity:0}
body.open .hero .eyebrow,body.open .hero h1,body.open .hero p{animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
body.open .hero .eyebrow{animation-delay:.35s}
body.open .hero h1{animation-delay:.45s}
body.open .hero p{animation-delay:.6s}
@keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
.scroll-cue{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;color:var(--rose-deep)}
body.open .scroll-cue{animation:rise .8s ease 1.1s both}
.cue-line{width:1px;height:36px;background:linear-gradient(var(--rose-deep),transparent);
  animation:slide 1.9s ease-in-out infinite}
@keyframes slide{0%,100%{transform:scaleY(.35);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* ═══════ bloky s fotkami ═══════ */
main{max-width:1060px;margin:0 auto;padding:0 22px}
.blok{display:grid;gap:26px;align-items:center;margin:0 0 clamp(78px,14vh,132px)}
.blok:first-child{margin-top:clamp(30px,8vh,70px)}

/* rámeček — plovoucí čtverec */
.ramecek{position:relative;aspect-ratio:1/1;border-radius:30px;overflow:hidden;
  background:var(--cream-2);will-change:transform;
  box-shadow:0 34px 60px -26px var(--lift),0 6px 16px -8px rgba(84,48,66,.1)}
.ramecek img{width:100%;height:100%;object-fit:cover;transform:scale(1.14);will-change:transform}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,#F2E4D6 0 22px,#F8EFE5 22px 44px)}
.ph span{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--rose-deep);background:rgba(255,255,255,.8);padding:9px 15px;border-radius:99px}

.text h2{font-family:'Fraunces',Georgia,serif;font-weight:900;letter-spacing:-.02em;
  font-size:clamp(27px,7vw,40px);line-height:1.07;margin-bottom:12px;text-wrap:balance}
.text p{font-size:16.5px;line-height:1.62;color:var(--mute);max-width:26em}
.js .text{opacity:0;transform:translateY(24px);
  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1)}
.js .text.in{opacity:1;transform:none}

/* telefon: pod sebou, fotka lehce odsazená na svou stranu */
.blok.vlevo  .ramecek{margin-right:9%}
.blok.vpravo .ramecek{margin-left:9%}
.blok.solo   .ramecek{max-width:78%;margin:0 auto;border-radius:34px}

/* od tabletu výš: dva sloupce a skutečné střídání stran */
@media (min-width:760px){
  .blok{grid-template-columns:1fr 1fr;gap:clamp(34px,5vw,64px)}
  .blok .ramecek{margin:0}
  .blok.vlevo  .ramecek{grid-column:1;grid-row:1}
  .blok.vlevo  .text   {grid-column:2;grid-row:1}
  .blok.vpravo .ramecek{grid-column:2;grid-row:1}
  .blok.vpravo .text   {grid-column:1;grid-row:1}
  .blok.solo{grid-template-columns:1fr}
  .blok.solo .ramecek{max-width:520px;margin:0 auto}
}

/* ═══════ závěr ═══════ */
.outro{display:flex;align-items:center;justify-content:center;padding:60px 20px 110px}
.box{width:100%;max-width:430px;background:var(--paper);border-radius:28px;padding:36px 26px 32px;
  box-shadow:0 34px 66px -26px var(--lift);
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.9,.3,1)}
.js .box{opacity:0;transform:translateY(26px) scale(.97)}
.js .box.in{opacity:1;transform:none}
.box h2{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(26px,7.5vw,34px);
  line-height:1.1;text-align:center;letter-spacing:-.02em;margin-bottom:10px;text-wrap:balance}
.box .sub{text-align:center;font-size:14.5px;color:var(--mute);line-height:1.55;margin-bottom:24px}
.field{margin-bottom:14px}
label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--rose-deep);margin-bottom:7px}
.field input{width:100%;font-family:inherit;font-size:17px;color:var(--ink);background:var(--cream);
  border:2px solid rgba(196,53,107,.2);border-radius:14px;padding:15px 16px;
  transition:border-color .18s,box-shadow .18s}
.field input:focus{outline:none;border-color:var(--rose-deep);box-shadow:0 0 0 4px rgba(196,53,107,.12)}
input::placeholder{color:#C4A594}
.hp{position:absolute;left:-9999px}
.btn{display:block;width:100%;font-family:inherit;font-size:16.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));border:0;border-radius:14px;
  padding:16px;margin-top:6px;cursor:pointer;box-shadow:0 14px 28px -10px rgba(196,53,107,.65);
  transition:transform .16s ease,box-shadow .16s ease,filter .16s;text-align:center}
.btn:hover,.btn:focus-visible{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn[disabled]{filter:grayscale(.4) brightness(1.08);cursor:default;transform:none}
:focus-visible{outline:3px solid var(--rose-deep);outline-offset:3px}
.note{font-size:12.5px;text-align:center;color:var(--mute);margin-top:12px;line-height:1.5;min-height:1em}
.note a{color:var(--rose-deep)}
.sign{text-align:center;margin-top:20px;font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600}
.done{display:none;text-align:center}
.done.show{display:block;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.done .big{font-size:48px;line-height:1;margin-bottom:14px}
.done p{font-size:15px;color:var(--mute);line-height:1.55}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .js .hero .eyebrow,.js .hero h1,.js .hero p,.js .scroll-cue,.js .text,.js .box{opacity:1!important}
  .js .text,.js .box{transform:none!important}
  .ramecek,.ramecek img{transform:none!important}
}
</style>
</head>
<body class="locked">

<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">
  Zapni si prosím JavaScript, jinak se stránka neotevře.</div></noscript>

<div id="bar"></div>
<canvas id="confetti"></canvas>

<div id="gate">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Otevřít">
    <div class="pocket"><div class="env-back"></div><div class="letter">♥</div></div>
    <div class="flap"></div><div class="seal">♥</div>
  </div>
  <p class="hint">Klepni na obálku</p>
</div>

<header class="hero">
  <div class="ball-wrap" aria-hidden="true"><div class="cord"></div><div class="ball"></div></div>
  <p class="eyebrow">Doručeno z tanečního parketu</p>
  <h1 id="uvodNadpis"></h1>
  <p id="uvodText"></p>
  <div class="scroll-cue" aria-hidden="true"><span>Scrolluj</span><span class="cue-line"></span></div>
</header>

<main id="kapitoly"></main>

<section class="outro">
  <div class="box" id="box">
    <div id="formBox">
      <h2 id="zaverNadpis"></h2>
      <p class="sub" id="zaverText"></p>
      <div class="field"><label for="tel">Telefon</label>
        <input type="tel" id="tel" inputmode="tel" autocomplete="tel" placeholder="+420 ..."></div>
      <div class="field"><label for="ig">Nebo Instagram</label>
        <input type="text" id="ig" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="@..."></div>
      <input type="checkbox" class="hp" id="botcheck" tabindex="-1" autocomplete="off">
      <button class="btn" id="send">Odeslat</button>
      <p class="note" id="note"></p>
      <p class="sign">— <span id="podpis"></span></p>
    </div>
    <div class="done" id="done">
      <div class="big">💌</div>
      <h2 id="doneTitle">Máš to poslané</h2>
      <p id="doneText">Teď už jenom čekej.<br>Dlouho to trvat nebude.</p>
    </div>
  </div>
</section>

<script>
document.documentElement.classList.add('js');

(function(){
  const N = NASTAVENI;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);
  const put = (id,v) => { const e = $(id); if(e) e.textContent = v; };

  put('uvodNadpis', N.uvodNadpis); put('uvodText', N.uvodText);
  put('zaverNadpis', N.zaverNadpis); put('zaverText', N.zaverText);
  put('podpis', N.podpis);
  document.title = N.uvodNadpis;

  /* ---------- bloky ---------- */
  const host = $('kapitoly');
  N.kapitoly.forEach((k, i) => {
    const typ = (k.typ === 'vpravo' || k.typ === 'solo') ? k.typ : 'vlevo';
    const b = document.createElement('section');
    b.className = 'blok ' + typ;
    let html = '<div class="ramecek"><div class="ph"><span>Fotka ' + (i + 1) + '</span></div></div>';
    if (typ !== 'solo') {
      html += '<div class="text"><h2>' + esc(k.nadpis) + '</h2><p>' + esc(k.text) + '</p></div>';
    }
    b.innerHTML = html;
    host.appendChild(b);
    if (k.foto) {
      const img = new Image();
      img.alt = '';
      img.onload = () => b.querySelector('.ramecek').replaceChildren(img);
      img.src = k.foto;
    }
  });

  const bloky = [...document.querySelectorAll('.blok')].map(el => ({
    el, ram: el.querySelector('.ramecek')
  }));

  /* ---------- plavání fotek ----------
     Rámeček se v průběhu scrollu jemně nadnáší a obrázek uvnitř
     jde opačným směrem — vypadá to, že fotka visí v prostoru.
     Běží ve smyčce, ne na "scroll" události — je to spolehlivější. */
  const bar = $('bar');
  let lastY = -1, lastH = -1;

  function frame(){
    const vh = innerHeight;
    const total = document.documentElement.scrollHeight - vh;
    bar.style.width = (total > 0 ? clamp(scrollY / total, 0, 1) * 100 : 0) + '%';

    for (const b of bloky) {
      const r = b.ram.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) continue;
      const stred = r.top + r.height / 2;
      const p = clamp((stred - vh * .5) / vh, -1, 1);   // -1 nahoře, 0 uprostřed, 1 dole
      b.ram.style.transform = 'translate3d(0,' + (p * 26).toFixed(2) + 'px,0)';
      const img = b.ram.querySelector('img');
      if (img) img.style.transform = 'scale(1.14) translate3d(0,' + (p * -22).toFixed(2) + 'px,0)';
    }
  }
  function loop(){
    const h = document.documentElement.scrollHeight;
    if (scrollY !== lastY || h !== lastH) { lastY = scrollY; lastH = h; frame(); }
    requestAnimationFrame(loop);
  }
  if (!reduce) { frame(); requestAnimationFrame(loop); }

  /* ---------- nájezd textů ---------- */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: .25 });
  document.querySelectorAll('.text').forEach(t => io.observe(t));
  new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }),
    { threshold: .3 }).observe($('box'));

  /* ---------- konfety ---------- */
  const cv = $('confetti'), ctx = cv.getContext('2d');
  let bits = [], raf = null;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const COLORS = ['#E0668F','#C4356B','#F5BFD1','#E5B667','#FFFFFF'];
  function burst(n, ox, oy){
    if (reduce) return;
    for (let i = 0; i < n; i++){
      const a = Math.random()*Math.PI*2, s = 4 + Math.random()*9;
      bits.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:5+Math.random()*7,h:7+Math.random()*9,
        rot:Math.random()*6.3,vr:(Math.random()-.5)*.32,c:COLORS[(Math.random()*COLORS.length)|0],life:1});
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    bits = bits.filter(b => b.life > 0 && b.y < cv.height + 60);
    for (const b of bits){
      b.vy += .21; b.vx *= .992; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= .0042;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.globalAlpha = clamp(b.life,0,1); ctx.fillStyle = b.c;
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
    }
    raf = bits.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,cv.width,cv.height), null);
  }

  /* ---------- obálka ---------- */
  const gate = $('gate'), env = $('env');
  let opened = false;
  function open(){
    if (opened) return; opened = true;
    env.classList.add('opened');
    const r = env.getBoundingClientRect();
    setTimeout(() => burst(70, r.left + r.width/2, r.top + r.height/2), 420);
    setTimeout(() => gate.classList.add('gone'), 1250);
    setTimeout(() => {
      document.body.classList.remove('locked');
      document.body.classList.add('open');
      gate.remove(); lastY = -1; frame();
    }, 1500);
  }
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); open(); } });

  /* ---------- odeslání ---------- */
  const hasKey = /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(String(N.accessKey).trim());
  const send = $('send'), note = $('note');
  if (!hasKey) send.textContent = 'Odeslat e-mailem';
  const mailtoUrl = (tel, ig) => 'mailto:' + N.email +
    '?subject=' + encodeURIComponent('Tady je můj kontakt') +
    '&body=' + encodeURIComponent('Telefon: ' + (tel||'—') + '\nInstagram: ' + (ig||'—') + '\n\n');

  send.addEventListener('click', async () => {
    const tel = $('tel').value.trim(), ig = $('ig').value.trim();
    if (!tel && !ig) { note.textContent = 'Vyplň aspoň jedno — telefon nebo Instagram.'; $('tel').focus(); return; }
    if (tel && tel.replace(/\D/g,'').length < 6) {
      note.textContent = 'Tohle na číslo nevypadá. Zkus to ještě jednou.'; $('tel').focus(); return; }
    if ($('botcheck').checked) return;

    if (!hasKey) {
      location.href = mailtoUrl(tel, ig);
      $('formBox').style.display = 'none';
      put('doneTitle','Otevřel jsem ti e-mail');
      $('doneText').innerHTML = 'Je celý předvyplněný.<br>Zbývá zmáčknout odeslat.';
      $('done').classList.add('show');
      return;
    }
    send.disabled = true; send.textContent = 'Posílám…'; note.textContent = '';
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify({ access_key:N.accessKey, subject:'Kontakt ze stránky',
          from_name:'Pozvánka', telefon: tel||'—', instagram: ig||'—' })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || 'chyba');
      $('formBox').style.display = 'none';
      $('done').classList.add('show');
      const r = $('box').getBoundingClientRect();
      burst(90, r.left + r.width/2, clamp(r.top + 80, 60, innerHeight - 80));
    } catch (err) {
      send.disabled = false; send.textContent = 'Zkusit znovu';
      note.innerHTML = 'Odeslání se nepovedlo. <a href="' + mailtoUrl(tel, ig) + '">Pošli to radši e-mailem.</a>';
    }
  });
})();
</script>
</body>
</html>
